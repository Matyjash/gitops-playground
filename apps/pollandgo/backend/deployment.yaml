apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pollandgo-backend
  template:
    metadata:
      labels:
        app: pollandgo-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/matyjash/pollandgo-backend
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pollandgo-database
                  key: DATABASE_URL
            - name: ALLOWED_ORIGINS
              value: http://pollandgo.localhost
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
