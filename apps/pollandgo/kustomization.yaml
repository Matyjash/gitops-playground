apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pollandgo
resources:
  - database
  - backend
  - frontend
  - ingress.yaml
  - default-deny-ingress.yaml
images:
  - name: ghcr.io/matyjash/pollandgo-backend
    newTag: v0.1.0
  - name: ghcr.io/matyjash/pollandgo-frontend
    newTag: v0.1.0
generators:
  - database/secret-generator.yaml
