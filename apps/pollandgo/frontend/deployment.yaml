apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pollandgo-frontend
  template:
    metadata:
      labels:
        app: pollandgo-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/matyjash/pollandgo-frontend
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
