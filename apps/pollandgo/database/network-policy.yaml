apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database
  namespace: pollandgo
spec:
  podSelector:
    matchLabels:
      app: pollandgo-database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: pollandgo-backend
    ports:
    - protocol: TCP
      port: 5432
