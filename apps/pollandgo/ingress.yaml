apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pollandgo
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pollandgo.localhost`) && PathPrefix(`/api`)
      kind: Rule
      priority: 20
      services:
        - name: backend
          port: 8080
    - match: Host(`pollandgo.localhost`)
      kind: Rule
      priority: 10
      services:
        - name: frontend
          port: 80
