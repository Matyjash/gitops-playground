apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-sops-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops-kustomize
    spec:
      version: v1
      generate:
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            umask 077
            output=$(mktemp)
            trap 'rm -f "$output"' EXIT
            test -f database-secret.sops.yaml
            kustomize build . > "$output"
            printf '\n---\n' >> "$output"
            /sops-tools/sops decrypt database-secret.sops.yaml >> "$output"
            cat "$output"
      preserveFileMode: false
      provideGitCreds: false
