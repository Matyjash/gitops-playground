# Strategic merge patch for the existing repo-server, not a standalone Deployment.
spec:
  template:
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: install-sops
          image: ghcr.io/getsops/sops:v3.13.1-alpine
          command: [/bin/sh, -c]
          args: ['cp /usr/local/bin/sops /sops-tools/sops']
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: sops-tools
              mountPath: /sops-tools
      containers:
        - name: sops-cmp
          # Keep this aligned with the installed Argo CD version.
          image: quay.io/argoproj/argocd:v3.5.2
          command: [/var/run/argocd/argocd-cmp-server]
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /sops-age/keys.txt
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: var-files
              mountPath: /var/run/argocd
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: sops-plugin-config
              mountPath: /home/argocd/cmp-server/config/plugin.yaml
              subPath: plugin.yaml
            - name: sops-tmp
              mountPath: /tmp
            - name: sops-tools
              mountPath: /sops-tools
              readOnly: true
            - name: sops-age
              mountPath: /sops-age
              readOnly: true
      volumes:
        - name: sops-tools
          emptyDir: {}
        - name: sops-plugin-config
          configMap:
            name: argocd-sops-plugin
        - name: sops-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: sops-age
          secret:
            secretName: sops-age
            defaultMode: 0440
