apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pollandgo
  namespace: argocd
spec:
  project: local
  source:
    repoURL: https://github.com/Matyjash/gitops-playground.git
    targetRevision: main
    path: apps/pollandgo
  destination:
    server: https://kubernetes.default.svc
    namespace: pollandgo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
